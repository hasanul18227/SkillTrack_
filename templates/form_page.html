{% extends "base.html" %}
{% block title %}{{ title }} · SkillTrack{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>{{ title }}</h2>
  {% if intro %}<p class="muted">{{ intro }}</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="hidden" name="next" value="{{ next|default:'' }}">
    <button class="btn" type="submit">{{ submit_label|default:"Save" }}</button>
  </form>
</div>
{% endblock %}
