{% extends "base.html" %}
{% block title %}{{ title }} · SkillTrack{% endblock %}
{% block content %}
<div class="card narrow">
  <h2>{{ title }}</h2>
  <p>{{ text }}</p>
  {% if user.is_authenticated %}
    <a class="btn" href="{% url 'dashboard' %}">Go to dashboard</a>
  {% else %}
    <a class="btn" href="{% url 'login' %}">Go to log in</a>
  {% endif %}
</div>
{% endblock %}
